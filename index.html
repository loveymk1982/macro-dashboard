<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주요 경제지표 동향</title>
<meta property="og:title" content="주요 경제지표 동향(주간)"><meta property="og:description" content="환율·금리·유가 대시보드(오전8시갱신)">
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--ac:#0b3d91;--wn:#fef3c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--ln:#334155;--ac:#93c5fd;--wn:#422006}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:8px}
h1{font-size:19px;margin:6px 0 2px;color:var(--ac)}.meta{font-size:12px;color:var(--mu);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 8px;margin-bottom:10px}
.card h2{font-size:15px;margin:0 0 6px}.card ul{margin:0;padding-left:18px}.card li{margin:3px 0;font-size:14px}
.kpi{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-bottom:6px}.kpi b{font-size:17px}
.up{color:#dc2626}.dn{color:#2563eb}.mu{color:var(--mu);font-size:12px}.warn{background:var(--wn);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:10px}
.cv{position:relative;height:230px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}th,td{border:1px solid var(--ln);padding:5px 6px;text-align:center}th{background:var(--bg)}
.src{font-size:11.5px;color:var(--mu);margin-top:6px}
.lk{display:block;text-decoration:none;color:var(--tx);border:2px solid var(--ac);border-radius:12px;padding:14px;margin-top:10px}.lk b{font-size:16px;color:var(--ac)}.lk span{display:block;font-size:12.5px;color:var(--mu);margin-top:2px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}#rf{font:inherit;font-size:13px;background:var(--ac);color:var(--card);border:0;border-radius:18px;padding:7px 14px;white-space:nowrap;cursor:pointer}#rf:disabled{opacity:.6}
footer{font-size:11.5px;color:var(--mu);padding:4px 2px 20px}
</style></head><body><main>
<div class="hd"><h1>주요 경제지표 동향 (주간)</h1><button id="rf" type="button">↻ 새로고침</button></div>
<div class="meta" id="meta">데이터 불러오는 중…</div>
<div id="app"></div>
<footer>모든 그래프는 최근 1년 기준입니다. 데이터는 매일 한국시간 오전 8시경 자동 갱신되며, 각 카드 아래에 출처와 자료 기준일을 표시합니다. 변동값(▲▼)은 직전 자료(전일·직전 영업일) 대비이며, 환율은 %, 금리는 %p입니다. 최고·최저는 기준일로부터 최근 한 달 구간의 값입니다. 핀치로 확대·축소할 수 있습니다.</footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const B="#2563eb",L="#ea580c",O="#6b7280",G="#16a34a",BAR="#cbd5e1";
const CH=[
{t:"달러/원 · 달러인덱스(DXY)",s:[{k:"usdkrw",n:"달러/원(좌)",a:"y",c:B},{k:"dxy",n:"DXY 산식(우)",a:"y1",c:O}],p:["usdkrw","y"]},
{t:"달러/페소 · 페소/원",s:[{k:"usdmxn",n:"달러/페소(좌)",a:"y",c:B},{k:"mxnkrw",n:"페소/원(우)",a:"y1",c:L}],p:["mxnkrw","y1"]},
{t:"달러/위안 · 위안/원",s:[{k:"usdcny",n:"달러/위안(좌)",a:"y",c:B},{k:"cnykrw",n:"위안/원(우)",a:"y1",c:L}],p:["cnykrw","y1"]},
{t:"달러/루피 · 루피/원",s:[{k:"usdinr",n:"달러/루피(좌)",a:"y",c:B},{k:"inrkrw",n:"루피/원(우)",a:"y1",c:L}],p:["inrkrw","y1"]},
{t:"유로/달러 · 유로/원",s:[{k:"eurusd",n:"유로/달러(좌)",a:"y",c:B},{k:"eurkrw",n:"유로/원(우)",a:"y1",c:L}],p:["eurkrw","y1"]},
{t:"미국 국채금리 (%)",pp:1,s:[{k:"us_sp",n:"10-2년 금리차(좌)",a:"y",c:BAR,bar:1},{k:"usbase",n:"기준금리(상단)",a:"y1",c:"#374151",step:1},{k:"us2y",n:"2년물",a:"y1",c:B},{k:"us10y",n:"10년물",a:"y1",c:L}]},
{t:"한국 국채금리 (%)",pp:1,s:[{k:"kr_sp",n:"10-2년 금리차(좌)",a:"y",c:BAR,bar:1},{k:"krbase",n:"기준금리",a:"y1",c:"#374151",step:1},{k:"kr2y",n:"2년물",a:"y1",c:B},{k:"kr10y",n:"10년물",a:"y1",c:L}]},
{t:"미−한 10년 금리차 · 달러/원",pp:1,tbl:1,s:[{k:"usdkrw",n:"달러/원(좌)",a:"y",c:B},{k:"gap",n:"미10-한10 금리차(우, %p)",a:"y1",c:G}],p:["usdkrw","y"]},
{t:"유가·운임 확인 링크",s:[],links:1,only:1}
];
const P={},M={};let D=null,CHS=[],LAST=0;
const dn=s=>Date.parse(s+"T00:00:00Z")/864e5;
const ds=s=>{const a=s.split("-");return a[0]+"."+(+a[1])+"."+(+a[2])};
const sd=n=>{const d=new Date(n*864e5);return (d.getUTCMonth()+1)+"/"+d.getUTCDate()};
const f=(v,p)=>v.toLocaleString("ko-KR",{maximumFractionDigits:p??(Math.abs(v)<100?3:2)});
const last=k=>(P[k]||[])[(P[k]||[]).length-1];
function back(k,days){const a=P[k];if(!a||!a.length)return null;const t=dn(a[a.length-1][0])-days;let b=a[0];for(const p of a){if(dn(p[0])<=t)b=p}return b}
function sub(a,b,name){const mb=new Map(P[b]||[]);P[name]=(P[a]||[]).filter(p=>mb.has(p[0])).map(p=>[p[0],+(p[1]-mb.get(p[0])).toFixed(4)])}
function chg(k,pp){const l=last(k),b=back(k,30);if(!l||!b)return null;return pp?l[1]-b[1]:(l[1]/b[1]-1)*100}
function insights(){const o=[],u=chg("usdkrw"),g=last("gap");
 if(u!=null){if(u>1)o.push(`원/달러 한달 ${f(u,1)}% 상승: 달러 결제 원자재·수입부품 원가 부담은 커지고, 수출 매출의 원화 환산에는 유리합니다.`);else if(u<-1)o.push(`원/달러 한달 ${f(-u,1)}% 하락: 수출 원화 환산 매출에는 불리하고, 수입 원가 부담은 줄어듭니다.`);else o.push("원/달러는 한달 전과 비슷한 수준(±1% 이내)으로 환율 영향 변화는 제한적입니다.")}
 if(g)o.push(`미−한 10년 금리차 ${f(g[1],2)}%p(${ds(g[0])}): 금리차가 크면 원화 약세 압력으로 작용할 수 있습니다.`);
 return o.slice(0,3)}
const fr=v=>v.toLocaleString("ko-KR",{minimumFractionDigits:2,maximumFractionDigits:3});
const md=s=>{const a=s.split("-");return (+a[1])+"/"+(+a[2])};
function prevp(k){const a=P[k]||[];return a[a.length-2]||a[a.length-1]}
function mmh(k,r){const a=P[k]||[];if(!a.length)return"";const t=dn(a[a.length-1][0])-30;let hi=null,lo=null;for(const p of a){if(dn(p[0])>=t){if(!hi||p[1]>hi[1])hi=p;if(!lo||p[1]<lo[1])lo=p}}
 return hi?`<br><span class="mu">최근 한달 최고 ${(r?fr:f)(hi[1])}(${md(hi[0])}) · 최저 ${(r?fr:f)(lo[1])}(${md(lo[0])})</span>`:""}
function build(){
 CHS.forEach(c=>c.destroy());CHS=[];for(const k in P)delete P[k];for(const k in M)delete M[k];
 const S=D.series;for(const k in S)P[k]=S[k].points,M[k]=S[k];
 sub("us10y","us2y","us_sp");sub("kr10y","kr2y","kr_sp");sub("us10y","kr10y","gap");
 M.us_sp=M.gap=M.kr_sp={name:"계산값",source:"국채 수익률로 계산(같은 날짜끼리 차이)",asof:null};
 const gen=D.generated_at.replace("T"," ").slice(0,16);
 const nk=new Date(Date.now()+9*36e5).toISOString().slice(0,16).replace("T"," ");document.getElementById("meta").innerHTML="마지막 수집: "+gen+" (KST)<br>화면 확인: "+nk+" (KST) · 표시 기간: 최근 1년";
 const app=document.getElementById("app");app.innerHTML="";
 if(D.errors&&D.errors.length){const w=document.createElement("div");w.className="warn";w.textContent="⚠ 일부 데이터 수집에 문제가 있어 이전 값이 표시될 수 있습니다: "+D.errors.slice(0,3).join(" / ");app.appendChild(w)}
 const top=document.createElement("div");top.className="card";
 const notes=(D.notes||[]).filter(Boolean),imp=(D.implications||[]).filter(Boolean),ins=imp.length?imp:insights();
 top.innerHTML="<h2>특이사항</h2>"+(notes.length?"<ul>"+notes.map(x=>`<li>${x}</li>`).join("")+"</ul>":'<div class="mu">이번 주 특이사항 미입력</div>')+"<h2 style='margin-top:10px'>자동차 부품산업 시사점"+(imp.length?"":" (자동 요약)")+"</h2><ul>"+ins.map(x=>`<li>${x}</li>`).join("")+"</ul>";
 app.appendChild(top);
 CH.forEach(c=>{
  const ok=c.s.filter(s=>(P[s.k]||[]).length);
  const el=document.createElement("div");el.className="card";
  const lkh=c.links?`<a class="lk" href="https://www.cmegroup.com/markets/energy/crude-oil/light-sweet-crude.html" target="_blank" rel="noopener noreferrer"><b>WTI 선물 확인 링크 ›</b><span>CME Group · 선물 시세는 원본 사이트에서 확인</span></a><a class="lk" href="https://en.sse.sh.cn/indices/scfinew.jsp" target="_blank" rel="noopener noreferrer"><b>SCFI 확인 링크 ›</b><span>상하이해운거래소(SSE) · 컨테이너 운임지수</span></a>`:"";
  if(c.only){el.innerHTML=`<h2>${c.t}</h2><div class="mu">라이선스 문제로 그래프 대신 원본 사이트로 연결합니다. 누르면 새 창에서 열립니다.</div>`+lkh;app.appendChild(el);return}
  if(!ok.length){el.innerHTML=`<h2>${c.t}</h2><div class="mu">데이터를 아직 받지 못했습니다. 아래 링크에서 확인하세요.</div>`+lkh;app.appendChild(el);return}
  let kp="";
  ok.filter(s=>!s.bar).forEach(s=>{const l=last(s.k),b=prevp(s.k),d=c.pp&&s.k!=="usdkrw"?l[1]-b[1]:(l[1]/b[1]-1)*100,pp=c.pp&&s.k!=="usdkrw";
   kp+=`<div><span class="mu">${s.n}</span><br><b>${(pp?fr:f)(l[1])}</b> ${Math.abs(d)<0.005?'<span class="mu">– 보합</span>':`<span class="${d>0?"up":"dn"}">${d>0?"▲":"▼"}${f(Math.abs(d),2)}${pp?"%p":"%"}</span>`} <span class="mu">(${ds(l[0])}, 직전 ${ds(b[0])} 대비)</span>${s.step?"":mmh(s.k,pp)}</div>`});
  if(c.p&&D.plan&&D.plan[c.p[0]]!=null)kp+=`<div><span class="mu">사업계획 ${f(D.plan[c.p[0]])}</span></div>`;
  let tb="";
  if(c.tbl){const row=(n,a,b,d)=>{const x=last(a),y=last(b),z=last(d);return x&&y&&z?`<tr><td>${n}</td><td>${fr(x[1])}<br><span class="mu">${ds(x[0])}</span></td><td>${fr(y[1])}<br><span class="mu">${ds(y[0])}</span></td><td>${fr(z[1])}<br><span class="mu">${ds(z[0])}</span></td></tr>`:""};
   const g=(a,b)=>last(a)&&last(b)?fr(last(a)[1]-last(b)[1]):"-";
   tb=`<table><tr><th>구분(%)</th><th>기준금리</th><th>2년물</th><th>10년물</th></tr>${row("미국","usbase","us2y","us10y")}${row("한국","krbase","kr2y","kr10y")}<tr><td>미−한(%p)</td><td>${g("usbase","krbase")}</td><td>${g("us2y","kr2y")}</td><td>${g("us10y","kr10y")}</td></tr></table><div class="src">표의 차이는 각 항목의 최신 표시값끼리 뺀 값이며 날짜가 다를 수 있습니다. 위 그래프의 금리차는 같은 날짜끼리 계산한 값입니다.</div>`}
  const raw=ok.map(s=>M[s.k]&&M[s.k].source).filter(Boolean),cross=raw.some(x=>x.includes(", USD 환율로 교차 계산")),srcs=[...new Set(raw.map(x=>x.replace(", USD 환율로 교차 계산","")))].join(" · ")+(cross?" · 원화 환율은 USD 환율로 교차 계산":"");
  const asof=ok.map(s=>{const l=last(s.k);return l?ds(l[0]):null}).filter(Boolean);
  const stale=ok.some(s=>M[s.k]&&M[s.k].stale);
  el.innerHTML=`<h2>${c.t}</h2><div class="kpi">${kp}</div><div class="cv"><canvas></canvas></div>${tb}<div class="src">출처: ${srcs||"-"}<br>자료 기준일: ${[...new Set(asof)].join(", ")} · 마지막 수집: ${gen}${stale?" · ⚠ 갱신 지연(이전 값)":""}</div>`+lkh;
  app.appendChild(el);
  const anchor=Math.max(...ok.map(s=>dn(last(s.k)[0]))),mn=anchor-365,mx0=anchor,mx=mx0+(mx0-mn)/19;
  const sets=ok.map(s=>({type:s.bar?"bar":"line",label:s.n,data:P[s.k].filter(p=>dn(p[0])>=mn).map(p=>({x:dn(p[0]),y:p[1]})),yAxisID:s.a,borderColor:s.c,backgroundColor:s.c,borderWidth:s.bar?0:(s.step?1.2:1.8),pointStyle:s.bar?"rect":"line",pointRadius:0,stepped:s.step?"before":false,borderDash:s.step?[4,3]:[],order:s.bar?2:1,barThickness:s.bar?2:undefined}));
  if(c.p&&D.plan&&D.plan[c.p[0]]!=null)sets.push({type:"line",label:"사업계획 "+f(D.plan[c.p[0]]),data:[{x:mn,y:D.plan[c.p[0]]},{x:mx,y:D.plan[c.p[0]]}],yAxisID:c.p[1],borderColor:"#dc2626",borderDash:[6,4],borderWidth:1.4,pointRadius:0,pointStyle:"line"});
  const css=getComputedStyle(document.documentElement),tx=css.getPropertyValue("--mu").trim(),gl=css.getPropertyValue("--ln").trim();
  CHS.push(new Chart(el.querySelector("canvas"),{data:{datasets:sets},options:{responsive:true,maintainAspectRatio:false,animation:false,layout:{padding:{top:4,right:2}},interaction:{mode:"nearest",intersect:false,axis:"x"},
   plugins:{legend:{labels:{usePointStyle:true,boxWidth:22,boxHeight:6,color:tx,font:{size:10}}},tooltip:{callbacks:{title:t=>{const d=new Date(t[0].parsed.x*864e5);return d.getUTCFullYear()+"."+(d.getUTCMonth()+1)+"."+d.getUTCDate()}}}},
   scales:{x:{type:"linear",offset:false,min:mn,max:mx,ticks:{maxTicksLimit:6,includeBounds:false,color:tx,font:{size:9},padding:2,callback:v=>sd(v)},grid:{color:gl,offset:false}},y:{position:"left",grace:"12%",beginAtZero:ok.some(s=>s.bar),ticks:{color:tx,font:{size:9},padding:2},grid:{color:gl}},y1:{position:"right",grace:"12%",ticks:{color:tx,font:{size:9},padding:2},grid:{drawOnChartArea:false}}}}}));
 });
}
function load(){const b=document.getElementById("rf");b.disabled=true;b.textContent="불러오는 중…";
 return Promise.all([fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch("config.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([j,c])=>{if(c){if(Array.isArray(c.notes))j.notes=c.notes;if(Array.isArray(c.implications))j.implications=c.implications;if(c.plan)j.plan=c.plan}D=j;build();LAST=Date.now()}).catch(()=>{if(!D){document.getElementById("meta").textContent="";document.getElementById("app").innerHTML='<div class="card"><h2>데이터 준비 중</h2><div class="mu">데이터를 불러오지 못했습니다. 잠시 후 새로고침을 눌러 주세요.</div></div>'}else document.getElementById("meta").innerHTML+="<br>⚠ 새로고침 실패(이전 화면 유지)"}).then(()=>{b.disabled=false;b.textContent="↻ 새로고침"})}
document.getElementById("rf").addEventListener("click",load);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-LAST>30*60*1000)load()});
load();
</script></body></html>
